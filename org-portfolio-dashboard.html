<!DOCTYPE html>
<html lang="en" data-org="trivium">
<head>
<meta charset="UTF-8">
<title>Campaign Analytics — Organization Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root, [data-org="trivium"], [data-org="ga4-trivium"]{
    --c1:#EF4060; --c2:#F4813E;
    --dark1:#2E2260; --dark2:#1E1745; --dark3:#3A2E7A;
    --tintA:#EFEDFA; --tintB:#FBEAE5;
    --bg:#F0EFF5;
    --font-display:'Poppins', sans-serif;
  }
  [data-org="eurekii"], [data-org="ga4-eurekii"]{
    --c1:#F0640A; --c2:#F2B705;
    --dark1:#0B1E5C; --dark2:#000E3E; --dark3:#30A7CF;
    --tintA:#EAF1FB; --tintB:#FDEEE0;
    --bg:#F2F4FA;
    --font-display:'Quicksand', sans-serif;
  }
  [data-org="ga4-cte"]{
    --c1:#6E9A1B; --c2:#0E8FB5;
    --dark1:#0B0B0C; --dark2:#000000; --dark3:#E0A62E;
    --tintA:#F2F6E8; --tintB:#E7F6FA;
    --bg:#F4F4F2;
    --font-display:'Poppins', sans-serif;
  }
  :root{
    --grad: linear-gradient(90deg, var(--c1) 0%, var(--c2) 100%);
    --ink:#2B2740; --slate:#6B7085; --slate-soft:#9CA0B3;
    --surface:#FFFFFF;
    --border:#E7E5F0; --red:#E24B4B; --red-light:#FBE7E7;
    --amber:#C98A1F; --amber-light:#FBF0DC;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow: 0 10px 30px rgba(46,34,96,0.08);
    --shadow-sm: 0 4px 14px rgba(46,34,96,0.06);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; transition:background .25s; }
  h1,h2,h3{ font-family:var(--font-display); }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px 70px; }
  button{ font-family:'Inter'; cursor:pointer; }

  /* ---------- ORG SWITCHER ---------- */
  .org-switcher{
    background:#17151C; display:flex; align-items:center; gap:6px; padding:10px 32px;
  }
  .org-tab{
    display:flex; align-items:center; gap:8px; background:transparent; border:1px solid transparent;
    border-radius:10px; padding:8px 16px; transition:.15s;
  }
  .org-tab .org-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .org-tab .org-name{ color:#8B87A0; font-family:'Inter'; font-weight:600; font-size:13px; }
  .org-tab.active{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.16); box-shadow: inset 0 -2px 0 var(--c1); }
  .org-tab.active .org-name{ color:#fff; }
  .org-tab:not(.active):hover{ background:rgba(255,255,255,0.04); }
  .org-tab:not(.active) .org-dot{ opacity:.5; }

  /* ---------- TOP BAR ---------- */
  header.topbar{
    background: radial-gradient(1100px 420px at 85% -10%, color-mix(in srgb, var(--c2) 35%, transparent), transparent 60%),
                linear-gradient(160deg, var(--dark1) 0%, var(--dark2) 100%);
    color:#fff; padding:26px 32px 22px; position:relative; overflow:hidden; transition:background .3s;
  }
  header.topbar::before{
    content:""; position:absolute; left:-80px; bottom:-120px; width:320px; height:320px;
    border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--c1) 30%, transparent), transparent 70%);
  }
  header.topbar::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--grad);
  }
  [data-org="eurekii"] header.topbar, [data-org="ga4-eurekii"] header.topbar{
    background: linear-gradient(90deg, #001576 0%, #003c8e 45%, #0150B2 100%);
  }
  [data-org="eurekii"] header.topbar::before, [data-org="ga4-eurekii"] header.topbar::before{ display:none; }
  .topbar-inner{ max-width:1180px; margin:0 auto; position:relative; z-index:2; }
  .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:18px; }
  .brand-block{ display:flex; align-items:center; gap:16px; }
  .header-logo-chip{
    background:transparent; border-radius:12px; padding:0; display:inline-flex; align-items:center;
    flex-shrink:0;
  }
  [data-org="trivium"] .header-logo-chip, [data-org="ga4-trivium"] .header-logo-chip{
    background:#fff; padding:9px 16px; box-shadow:0 8px 20px rgba(0,0,0,0.18);
  }
  [data-org="ga4-cte"] .header-logo-chip{
    background:#fff; padding:9px 16px; box-shadow:0 8px 20px rgba(0,0,0,0.18);
  }
  .header-logo{ height:30px; display:block; }
  [data-org="trivium"] .header-logo, [data-org="ga4-trivium"] .header-logo{ height:26px; }
  [data-org="ga4-cte"] .header-logo{ height:22px; }
  .eyebrow{ font-family:var(--font-display); font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#C9C3E8; margin:0 0 8px; }
  h1.brand-title{ font-weight:800; font-size:clamp(24px,3.4vw,34px); margin:0; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .date-filter{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); border-radius:100px; padding:7px 9px 7px 16px; }
  .date-filter label{ font-size:11px; color:#C9C3E8; font-weight:600; }
  .date-filter input[type=date]{ background:transparent; border:none; color:#fff; font-family:'Inter'; font-size:12.5px; font-weight:600; color-scheme:dark; outline:none; }
  .date-filter .sep{ color:#7A72A6; }
  .date-filter button{ border:none; border-radius:100px; padding:7px 15px; font-size:12px; font-weight:700; }
  .btn-apply{ background:var(--grad); color:#fff; }
  .btn-reset{ background:rgba(255,255,255,0.1); color:#C9C3E8; }
  .filter-note{ font-size:11.5px; color:#AFA8D2; margin-top:8px; text-align:right; }

  /* ---------- NAV PILLS ---------- */
  .campaign-nav{ display:flex; gap:8px; padding:14px 32px; background:#F5F4FA; border-bottom:1px solid var(--border); overflow-x:auto; max-width:1180px; margin:0 auto; }
  .nav-pill{ border:1px solid var(--border); background:#fff; color:var(--slate); border-radius:100px; padding:8px 16px; font-size:12.5px; font-weight:600; white-space:nowrap; transition:.15s; }
  .nav-pill.active{ background:var(--dark1); color:#fff; border-color:var(--dark1); }
  .nav-pill:not(.active):not(.dim):hover{ border-color:var(--c1); color:var(--c1); }
  .nav-pill.dim{ opacity:.4; cursor:not-allowed; }
  .nav-pill .status-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:middle; }

  /* ---------- SECTIONS / CARDS ---------- */
  .section{ margin-top:34px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .section-head h2{ font-weight:700; font-size:18px; margin:0; color:var(--dark1); }
  .section-head .sub{ font-size:12.5px; color:var(--slate); }
  .card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:22px 24px; }

  /* ---------- SUMMARY: KPI ROW ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:22px; }
  @media(max-width:900px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .kpi-card{ background:var(--surface); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:16px 18px; }
  .kpi-card .l{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); font-weight:700; }
  .kpi-card .n{ font-family:var(--font-display); font-weight:800; font-size:24px; margin-top:6px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  [data-org="eurekii"] .kpi-card .n, [data-org="ga4-eurekii"] .kpi-card .n{ background:none; -webkit-background-clip:initial; background-clip:initial; color:#0057A6; }

  /* ---------- SUMMARY: campaign table ---------- */
  .table-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); padding:14px 22px; border-bottom:1px solid var(--border); cursor:pointer; user-select:none; white-space:nowrap; font-weight:700; }
  thead th:hover{ color:var(--c1); }
  thead th .arrow{ font-size:10px; margin-left:4px; opacity:.5; }
  tbody td{ padding:15px 22px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:.12s; }
  tbody tr:hover{ background:var(--bg); }
  .camp-name{ font-weight:700; color:var(--dark1); }
  .camp-period{ font-size:11.5px; color:var(--slate-soft); margin-top:2px; }
  .status-chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:100px; font-size:11px; font-weight:700; }
  .status-chip.completed{ background:var(--tintB); color:var(--c1); }
  .status-chip.progress{ background:var(--amber-light); color:var(--amber); }
  .status-chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .view-link{ color:var(--c1); font-weight:700; font-size:12.5px; }

  /* ---------- CAMPAIGN DASHBOARD ---------- */
  .camp-header{ display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--slate); text-decoration:none; margin-bottom:10px; background:none; border:none; padding:0; }
  .back-link:hover{ color:var(--c1); }
  .back-link svg{ width:14px; height:14px; }
  h1.camp-title{ font-weight:800; font-size:26px; margin:0 0 4px; color:var(--dark1); }
  .camp-period{ font-size:13px; color:var(--slate); font-weight:500; }
  .status-pill{ display:inline-flex; align-items:center; gap:8px; color:#fff; padding:9px 18px; border-radius:100px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .status-pill.completed{ background:var(--grad); box-shadow:0 8px 20px rgba(0,0,0,0.18); }
  .status-pill.progress{ background:linear-gradient(90deg,#C98A1F,#E0AB4E); box-shadow:0 8px 20px rgba(201,138,31,0.28); }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; background:#fff; }

  .kpi-row{ display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap; }
  .kpi-chip{ background:var(--surface); border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow-sm); min-width:112px; }
  .kpi-chip .n{ font-family:var(--font-display); font-weight:800; font-size:20px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  [data-org="eurekii"] .kpi-chip .n, [data-org="ga4-eurekii"] .kpi-chip .n{ background:none; -webkit-background-clip:initial; background-clip:initial; color:#0057A6; }
  .kpi-chip .l{ font-size:10.5px; color:var(--slate); font-weight:600; margin-top:1px; }

  /* funnel */
  .funnel-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:24px 24px 22px; }
  .funnel-wrap{ position:relative; }
  .fn-row{ display:flex; align-items:stretch; gap:0; }
  .fn-tile{ position:relative; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:16px 14px; text-align:center; cursor:pointer; opacity:0; transform:translateY(14px); min-width:0; transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
  .fn-tile.in{ animation: fnPop .55s cubic-bezier(.2,.7,.3,1.15) forwards; }
  @keyframes fnPop{ to{ opacity:1; transform:translateY(0); } }
  .fn-tile:hover{ box-shadow:0 14px 30px rgba(0,0,0,0.14); transform:translateY(-3px); border-color:transparent; z-index:3; }
  .fn-tile .fn-label{ font-family:'Inter'; font-weight:600; font-size:12px; color:var(--slate); }
  .fn-tile .fn-value{ font-family:var(--font-display); font-weight:800; font-size:24px; margin-top:5px; line-height:1; color:var(--dark1); }
  .fn-tile .fn-badge{ display:inline-block; margin-top:7px; font-family:var(--font-display); font-weight:700; font-size:10.5px; padding:2px 9px; border-radius:100px; background:var(--tintB); color:var(--c1); opacity:0; transition:opacity .2s; }
  .fn-tile:hover .fn-badge{ opacity:1; }
  .fn-tile.sent{ background:var(--tintA); border-color:transparent; }
  .fn-tile.sent .fn-label{ color:var(--dark3); }
  .fn-tile.opted{ background:var(--red-light); border-color:transparent; }
  .fn-tile.opted .fn-value, .fn-tile.opted .fn-label{ color:var(--red); }
  .fn-tile.clicked{ background:var(--tintB); border-color:transparent; }
  .fn-tile.clicked .fn-value{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  [data-org="eurekii"] .fn-tile.clicked .fn-value, [data-org="ga4-eurekii"] .fn-tile.clicked .fn-value{ background:none; -webkit-background-clip:initial; background-clip:initial; color:#0057A6; }
  .fn-tile.clicked .fn-label{ color:var(--c1); }
  .fn-connector{ flex:0 0 58px; position:relative; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .3s; }
  .fn-connector.in{ opacity:1; }
  .fn-connector::before{ content:""; position:absolute; left:2px; right:2px; top:50%; height:2px; transform:translateY(-50%); background:linear-gradient(90deg, var(--border), var(--c1) 50%, var(--border)); border-radius:2px; }
  .fn-connector .chip{ position:relative; z-index:2; background:#fff; border:1px solid var(--border); border-radius:100px; padding:4px 9px; font-family:var(--font-display); font-weight:700; font-size:10.5px; color:var(--c1); box-shadow:0 4px 10px rgba(0,0,0,0.07); white-space:nowrap; }
  .fn-branch{ display:flex; align-items:center; gap:12px; margin:18px 0; opacity:0; transition:opacity .35s; }
  .fn-branch.in{ opacity:1; }
  .fn-branch::before{ content:""; flex:0 0 44px; height:1px; background:var(--border); }
  .fn-branch::after{ content:""; flex:1; height:1px; background:var(--border); }
  .fn-branch .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--dark1); color:#fff; border-radius:100px; padding:7px 16px; font-family:var(--font-display); font-weight:700; font-size:11.5px; box-shadow:0 8px 18px rgba(0,0,0,0.18); white-space:nowrap; }
  .fn-branch .chip svg{ width:13px; height:13px; }

  .tooltip{ position:absolute; pointer-events:none; background:var(--dark2); color:#fff; padding:10px 14px; border-radius:10px; font-size:12px; line-height:1.5; font-family:'Inter'; box-shadow:0 14px 28px rgba(0,0,0,0.35); z-index:50; opacity:0; transition:opacity .12s; max-width:220px; }
  .tooltip b{ font-family:var(--font-display); color:var(--c2); }
  .tooltip.show{ opacity:1; }

  /* insight charts */
  .insight-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
  @media(max-width:800px){ .insight-grid{ grid-template-columns:1fr; } }
  .insight-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:20px 22px; }
  .insight-card .card-title{ font-family:var(--font-display); font-weight:700; font-size:13.5px; color:var(--dark1); }
  .chart-box{ height:200px; margin-top:6px; }
  .chart-box.donut{ display:flex; align-items:center; gap:16px; height:170px; }
  .donut-wrap{ position:relative; width:110px; height:110px; flex-shrink:0; }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .donut-center .n{ font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--dark1); }
  .donut-center .l{ font-size:9px; color:var(--slate); font-weight:600; }
  .legend{ display:flex; flex-direction:column; gap:9px; flex:1; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .legend-item .sw{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .legend-item .lbl{ color:var(--slate); }
  .legend-item .val{ font-weight:700; color:var(--dark1); margin-left:auto; padding-left:10px; }
  .legend-item.stacked{ align-items:flex-start; flex-direction:column; gap:2px; }
  .legend-item.stacked .row1{ display:flex; align-items:center; gap:8px; width:100%; }
  .legend-item.stacked .desc{ font-size:11px; color:var(--slate-soft); padding-left:17px; line-height:1.4; }

  /* GA4: KPI delta */
  .kpi-delta{ font-size:10.5px; font-weight:700; margin-top:4px; display:inline-flex; align-items:center; gap:3px; }
  .kpi-delta.up{ color:#1F9D55; }
  .kpi-delta.down{ color:var(--red); }
  .kpi-delta svg{ width:10px; height:10px; }

  /* GA4: day callouts */
  .day-callout-row{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
  .day-callout{ display:flex; align-items:center; gap:10px; background:var(--tintA); border-radius:var(--radius-sm); padding:10px 16px; flex:1; min-width:180px; }
  .day-callout .ico{ width:30px; height:30px; border-radius:8px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--c1); }
  .day-callout .ico svg{ width:15px; height:15px; }
  .day-callout .lbl{ font-size:10.5px; color:var(--slate); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .day-callout .val{ font-family:var(--font-display); font-weight:800; font-size:14px; color:var(--dark1); }

  /* GA4: click list */
  .click-list-row{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .click-list-row:last-child{ border-bottom:none; }
  .click-list-count{
    font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--c1); background:var(--tintB);
    border-radius:8px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .click-list-text .t1{ font-weight:700; font-size:13px; color:var(--dark1); }
  .click-list-text .t2{ font-size:11.5px; color:var(--slate); margin-top:2px; }
  .video-note{ background:var(--tintB); border-radius:var(--radius-sm); padding:12px 16px; font-size:12.5px; color:var(--ink); margin-top:14px; display:flex; gap:10px; align-items:flex-start; }
  .video-note svg{ width:16px; height:16px; color:var(--c1); flex-shrink:0; margin-top:1px; }

  /* contacts */
  .contacts-card{ background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
  .contacts-toolbar{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); gap:16px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:100px; padding:9px 16px; background:var(--bg); min-width:230px; }
  .search-box svg{ width:15px; height:15px; color:var(--slate-soft); flex-shrink:0; }
  .search-box input{ border:none; background:transparent; outline:none; font-family:'Inter'; font-size:13px; width:100%; color:var(--ink); }
  .count-badge{ font-family:var(--font-display); font-size:12px; font-weight:600; color:var(--slate); }
  .contact-avatar{ width:34px; height:34px; border-radius:50%; background:var(--grad); color:#fff; font-family:var(--font-display); font-weight:700; font-size:13px; display:inline-flex; align-items:center; justify-content:center; margin-right:10px; flex-shrink:0; }
  .contact-name-row{ display:flex; align-items:center; }
  .contact-name{ font-weight:700; color:var(--dark1); }
  .contact-org{ font-size:12px; color:var(--slate); margin-top:2px; }
  a.email-link, a.phone-link{ color:var(--c1); text-decoration:none; font-weight:600; font-size:12.5px; }
  a.email-link:hover, a.phone-link:hover{ text-decoration:underline; }
  .tag-genuine{ display:inline-flex; align-items:center; gap:6px; background:var(--tintB); color:var(--c1); padding:5px 12px; border-radius:100px; font-size:11px; font-weight:700; }
  .tag-genuine::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--c1); }

  footer.page-footer{ margin-top:40px; padding-top:20px; border-top:1px solid var(--border); font-size:12px; color:var(--slate-soft); }
  .placeholder-note{ display:flex; align-items:center; gap:8px; background:var(--amber-light); color:var(--amber); border-radius:10px; padding:10px 16px; font-size:12px; font-weight:600; margin-bottom:20px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>

<div class="org-switcher" id="orgSwitcher"></div>

/* ============== PORTFOLIO DATA ============== */
let ORG_DATA = {};

async function loadCampaigns() {
    try {
        const response = await fetch("campaign-dashboard.php");
        const data = await response.json();

        if (!data.success) {
            console.error(data.message);
            return;
        }
        const response_trivium = await fetch("campaign-dashboard-trivium.php");
        const data_trivium = await response_trivium.json();

        if (!data_trivium.success) {
            console.error(data_trivium.message);
            return;
        }

        ORG_DATA = {
            eurekii: {
                label: "Eurekii",
                campaigns: data.campaigns.map(campaign => ({
                    id: campaign.id,
                    name: campaign.name,
                    status: campaign.status.toLowerCase() === "active"
                        ? "progress"
                        : "completed",

                    start: campaign.start,
                    end: campaign.end,
                    placeholder: false,

                    funnel: {
                        mailer: [
                            {
                                key: "sent",
                                label: "Sent",
                                value: Number(campaign.summary.sent),
                                rate: null
                            },
                            {
                                key: "opened",
                                label: "Opened",
                                value: Number(campaign.summary.opened),
                                rate: campaign.summary.sent
                                    ? campaign.summary.opened / campaign.summary.sent
                                    : 0
                            },
                            {
                                key: "clicked",
                                label: "Clicked",
                                value: Number(campaign.summary.clicked),
                                rate: campaign.summary.sent
                                    ? campaign.summary.clicked / campaign.summary.sent
                                    : 0
                            },
                            {
                                key: "optout",
                                label: "Opted out",
                                value: Number(campaign.summary.optOut),
                                rate: campaign.summary.sent
                                    ? campaign.summary.optOut / campaign.summary.sent
                                    : 0
                            }
                        ],

                        fu: [
                            {
                                key: "fusent",
                                label: "FU Sent",
                                value: Number(campaign.summary.opened),
                                rate: null
                            },
                            {
                                key: "fuopened",
                                label: "FU Opened",
                                value: Number(campaign.summary.opened),
                                rate: 1
                            },
                            {
                                key: "fuclicked",
                                label: "FU Clicked",
                                value: Number(campaign.summary.clicked),
                                rate: campaign.summary.opened
                                    ? campaign.summary.clicked / campaign.summary.opened
                                    : 0
                            }
                        ]
                    },

                    rates: [
                        {
                            label: "Mailer Open %",
                            value: Number(campaign.rates.openRate),
                            kind: "good"
                        },

/* ============== STATE ============== */
const state = { org:'eurekii', view:'summary', dateFrom:null, dateTo:null, sortKey:'start', sortDir:1 };

function isGA4(){ return ORG_DATA[state.org].type === 'ga4'; }
function items(){ return isGA4() ? ORG_DATA[state.org].reports : ORG_DATA[state.org].campaigns; }
function campaigns(){ return items(); }
function orgBounds(){
  const c = items();
  const starts = c.map(x=>x.start).sort();
  const ends = c.map(x=>x.end).sort();
  return { from:starts[0], to:ends[ends.length-1] };
}
function inRange(c){ return c.end >= state.dateFrom && c.start <= state.dateTo; }
function fmtDate(d){
    if (!d) return "-";
    const dt = new Date(d.replace(' ', 'T'));
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${String(dt.getDate()).padStart(2,'0')} ${months[dt.getMonth()]} '${String(dt.getFullYear()).slice(2)}`;
//   const dt = new Date(d+'T00:00:00');
//   const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
//   return `${String(dt.getDate()).padStart(2,'0')} ${months[dt.getMonth()]} '${String(dt.getFullYear()).slice(2)}`;
}
function fmtPct(r){ return r===null || r===undefined ? '—' : (r*100).toFixed(1)+'%'; }

/* ============== ORG SWITCHER ============== */
function defaultViewFor(orgKey){
  const org = ORG_DATA[orgKey];
  if(org.type === 'ga4') return org.reports[0].id;
  return 'summary';
}

function renderOrgSwitcher(){
  const el = document.getElementById('orgSwitcher');
  el.innerHTML = '';
  Object.keys(ORG_DATA).forEach(orgKey=>{
    const tab = document.createElement('button');
    tab.className = 'org-tab' + (state.org===orgKey ? ' active' : '');
    const dotColor = THEME_COLORS[orgKey].c1;
    tab.innerHTML = `<span class="org-dot" style="background:${dotColor}"></span><span class="org-name">${ORG_DATA[orgKey].label}</span>`;
    tab.onclick = ()=>{
      if(state.org===orgKey) return;
      state.org = orgKey;
      state.view = defaultViewFor(orgKey);
      const b = orgBounds();
      state.dateFrom = b.from; state.dateTo = b.to;
      document.getElementById('dateFrom').value = state.dateFrom;
      document.getElementById('dateTo').value = state.dateTo;
      document.documentElement.setAttribute('data-org', orgKey);
      document.getElementById('orgEyebrow').textContent = ORG_DATA[orgKey].label + ' · Campaign Analytics';
      document.getElementById('headerLogo').src = LOGOS[orgKey];
      render();
    };
    el.appendChild(tab);
  });
}

/* ============== NAV ============== */
function renderNav(){
  const nav = document.getElementById('campaignNav');
  nav.innerHTML = '';
  const ga4 = isGA4();

  if(!ga4){
    const summaryPill = document.createElement('button');
    summaryPill.className = 'nav-pill' + (state.view==='summary' ? ' active' : '');
    summaryPill.textContent = 'Summary';
    summaryPill.onclick = ()=>{ state.view='summary'; render(); };
    nav.appendChild(summaryPill);
  }

  const list = items();
  if(!ga4 || list.length > 1){
    list.forEach(c=>{
      const pill = document.createElement('button');
      const dimmed = !inRange(c);
      pill.className = 'nav-pill' + (state.view===c.id ? ' active' : '') + (dimmed ? ' dim' : '');
      const dotColor = c.status==='completed' ? 'var(--c1)' : 'var(--amber)';
      pill.innerHTML = `<span class="status-dot" style="background:${dotColor}"></span>${c.name}`;
      pill.disabled = dimmed;
      pill.onclick = ()=>{ if(!dimmed){ state.view=c.id; render(); } };
      nav.appendChild(pill);
    });
  }
}

function renderCampaignTable(filtered){
  const rows = filtered.map(c=>({
    id:c.id, name:c.name, start:c.start, end:c.end, status:c.status,
    sent:c.funnel.mailer[0].value,
    openRate: c.rates[0].value,
    clickRate: c.rates[1].value,
    leads: c.contacts.length
  }));
  rows.sort((a,b)=>{
    const av=a[state.sortKey], bv=b[state.sortKey];
    if(av<bv) return -1*state.sortDir;
    if(av>bv) return 1*state.sortDir;
    return 0;
  });
  const tbody = document.getElementById('campaignTableBody');
  tbody.innerHTML = rows.map(r=>{
    const camp = campaigns().find(c=>c.id===r.id);

  });

/* ============== CAMPAIGN DASHBOARD VIEW ============== */
function countUp(el, target, duration=700){
  const start = performance.now();
  function step(now){
    const p = Math.min((now-start)/duration, 1);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target*eased);
    if(p<1) requestAnimationFrame(step); else el.textContent = target;
  }
  requestAnimationFrame(step);
}
function tileClass(s){
  if(s.key==='sent' || s.key==='fusent') return 'sent';
  if(s.key==='optout') return 'opted';
  if(s.key==='clicked' || s.key==='fuclicked') return 'clicked';
  return '';
}
function buildRow(stages, wrap, tooltip){
  const row = document.createElement('div');
  row.className = 'fn-row';
  const maxVal = Math.max(...stages.map(s=>s.value), 1);
  stages.forEach((s,i)=>{
    const tile = document.createElement('div');
    tile.className = 'fn-tile ' + tileClass(s);
    const grow = Math.max(0.62, s.value/maxVal) * 1.4;
    tile.style.flex = `${grow} ${grow} 0`;
    tile.innerHTML = `
      <div class="fn-label">${s.label}</div>
      <div class="fn-value" data-target="${s.value}">0</div>
      <div class="fn-badge">${s.rate!==null ? fmtPct(s.rate)+' of prior' : 'Baseline'}</div>
    `;
    tile.addEventListener('mousemove', (e)=>{
      const bb = wrap.getBoundingClientRect();
      tooltip.innerHTML = `<b>${s.label}</b><br>${s.value} contacts${s.rate!==null ? ' · '+fmtPct(s.rate)+' of prior stage' : ''}`;
      tooltip.style.left = (e.clientX - bb.left + 16) + 'px';
      tooltip.style.top = (e.clientY - bb.top - 10) + 'px';
      tooltip.classList.add('show');
    });
    tile.addEventListener('mouseleave', ()=> tooltip.classList.remove('show'));
    row.appendChild(tile);
    if(i < stages.length-1){
      const next = stages[i+1];
      const connector = document.createElement('div');
      connector.className = 'fn-connector';
      connector.innerHTML = `<span class="chip">${fmtPct(next.rate)}</span>`;
      row.appendChild(connector);
    }
  });
  return row;
}

function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

function renderContacts(camp){
  const tbody = document.getElementById('contactsBody');
  const searchInput = document.getElementById('searchInput');
  const countBadge = document.getElementById('countBadge');
  let sortKey='sent', sortDir=1;

  function draw(){
    const q = searchInput.value.trim().toLowerCase();
    let rows = camp.contacts.filter(c => c.name.toLowerCase().includes(q) || c.org.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
    rows.sort((a,b)=>{ const av=a[sortKey], bv=b[sortKey]; if(av<bv) return -1*sortDir; if(av>bv) return 1*sortDir; return 0; });
    tbody.innerHTML = rows.length===0
      ? `<tr><td colspan="6" style="text-align:center;color:var(--slate);padding:32px;">No contacts match your search.</td></tr>`
      : rows.map(c=>`
        <tr>
          <td>${fmtDate(c.sent)}</td>
          <td>${fmtDate(c.clicked)}</td>
          <td><div class="contact-name-row"><div class="contact-avatar">${initials(c.name)}</div><div><div class="contact-name">${c.name}</div><div class="contact-org">${c.title}</div></div></div></td>
          <td>${c.org}</td>
          <td><div><a class="email-link" href="mailto:${c.email}">${c.email}</a></div><div><a class="phone-link" href="tel:${c.phone.replace(/ /g,'')}">${c.phone}</a></div></td>
          <td><span class="tag-genuine">Genuine</span></td>
        </tr>`).join('');
    countBadge.textContent = rows.length + (rows.length===1 ? ' contact' : ' contacts');
  }

  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.key;
      if(sortKey===key){ sortDir *= -1; } else { sortKey=key; sortDir=1; }
      draw();
    };
  });
  searchInput.addEventListener('input', draw);
  draw();
}

  }).join('');

  const highlightsHtml = (report.highlights||[]).map(h=>`
    <div class="kpi-card">
      <div class="l">${h.label}</div>
      <div class="n">${h.value.toLocaleString()}</div>
      <div style="font-size:11px;color:var(--slate-soft);margin-top:4px;">${h.note}</div>
    </div>`).join('');

  app.innerHTML = `
    <div style="margin-top:26px;">
      ${multiReport ? `<button class="back-link" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to reports
      </button>` : ''}
      ${report.placeholder ? `<div class="placeholder-note">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
        Sample placeholder report — swap in real GA4 data when available.
      </div>` : ''}
      <div class="camp-header">
        <div>
          <h1 class="camp-title">Website Performance</h1>
          <p class="camp-period">${fmtDate(report.start)} → ${fmtDate(report.end)} · Data source: Google Analytics</p>
        </div>
        <span class="status-pill ${statusClass}"><span class="dot"></span>${statusLabel}</span>
      </div>

      <div class="section-head" style="margin-top:4px;">
        <h2>Key numbers at a glance</h2>
        <span class="sub">Hover a card for what it means · vs. the previous fortnight</span>
      </div>
      <div class="kpi-row">${kpiHtml}</div>

      <div class="section" style="margin-top:28px;">
        <div class="section-head">
          <h2>How traffic changed day by day</h2>
          <span class="sub">Unique visitors, engaged visitors &amp; total visits — each day</span>
        </div>
        <div class="card">
          <div style="height:240px;"><canvas id="dailyChart"></canvas></div>
          <div class="day-callout-row">
            <div class="day-callout">
              <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></div>
              <div><div class="lbl">Best Day</div><div class="val">${report.bestDay.label} · ${report.bestDay.value} visits</div></div>
            </div>
            <div class="day-callout">
              <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/></svg></div>
              <div><div class="lbl">Quietest Day</div><div class="val">${report.quietestDay.label} · ${report.quietestDay.value} visit${report.quietestDay.value===1?'':'s'}</div></div>
            </div>
            <div class="day-callout">
              <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></div>
              <div><div class="lbl">Total Visits</div><div class="val">${report.totalVisits} over 2 weeks</div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Visitor demographics</h2>
          <span class="sub">Device used &amp; top countries of origin</span>
        </div>
        <div class="insight-grid">
          <div class="insight-card">
            <div class="card-title">What device did they use?</div>
            <div class="chart-box donut">
              <div class="donut-wrap">
                <canvas id="deviceDonut"></canvas>
                <div class="donut-center"><div class="n" id="deviceTotal">0</div><div class="l">visitors</div></div>
              </div>
              <div class="legend" id="deviceLegend"></div>
            </div>
          </div>
          <div class="insight-card">
            <div class="card-title">Top ${Math.min(report.countries.length,10)} — visitors by country</div>
            <div class="chart-box"><canvas id="countryChart"></canvas></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>How did people find the site?</h2>
          <span class="sub">Where the ${report.totalVisits} visits came from</span>
        </div>
        <div class="insight-card">
          <div class="chart-box donut" style="height:auto;align-items:flex-start;">
            <div class="donut-wrap" style="margin-top:6px;">
              <canvas id="acqDonut"></canvas>
              <div class="donut-center"><div class="n" id="acqTotal">0</div><div class="l">visits</div></div>
            </div>
            <div class="legend" id="acqLegend" style="flex:1;"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Which pages did people visit?</h2>
          <span class="sub">All page views, and where visitors first landed</span>
        </div>
        <div class="insight-grid">
          <div class="insight-card">
            <div class="card-title">Page views</div>
            <div class="chart-box" style="height:${Math.max(180, report.pageViews.length*20)}px;"><canvas id="pageViewsChart"></canvas></div>
          </div>
          <div class="insight-card">
            <div class="card-title">Where visitors first landed — top 5</div>
            <div style="margin-top:6px;" id="topPagesList"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>Visitor behavior</h2>
          <span class="sub">Key action signals — ${report.behavior.find(b=>b.label==='Viewed a Page')?.value || ''} total actions recorded</span>
        </div>
        <div class="kpi-grid" style="margin-top:0;margin-bottom:16px;">${highlightsHtml}</div>
        <div class="card"><div style="height:${Math.max(220, report.behavior.length*26)}px;"><canvas id="behaviorChart"></canvas></div></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>What did they click &amp; watch?</h2>
          <span class="sub">Specific links clicked and video engagement, detail behind the actions above</span>
        </div>
        <div class="insight-grid">
          <div class="insight-card">
            <div class="card-title">What did they click?</div>
            <div style="margin-top:6px;" id="clickListCard"></div>
          </div>
          <div class="insight-card">
            <div class="card-title">What did they watch? (${report.video ? report.video.totalEvents : 0} video events)</div>
            <div style="margin-top:6px;" id="videoStagesCard"></div>
          </div>
        </div>
      </div>
    </div>
  `;

  if(multiReport){
    document.getElementById('backBtn').onclick = ()=>{ state.view='summary'; render(); };
  }

  const theme = THEME_COLORS[state.org];

  /* daily traffic line chart */
  new Chart(document.getElementById('dailyChart'), {
    type:'line',
    data:{
      labels: report.daily.map(d=>d.label),
      datasets:[
        { label:'Total Visits', data: report.daily.map(d=>d.total), borderColor: theme.c1, backgroundColor:'transparent', tension:0.35, pointRadius:3 },
        { label:'Unique Visitors', data: report.daily.map(d=>d.unique), borderColor: theme.c2, backgroundColor:'transparent', tension:0.35, pointRadius:3 },
        { label:'Engaged', data: report.daily.map(d=>d.engaged), borderColor: theme.dark3, backgroundColor:'transparent', tension:0.35, pointRadius:3 },
      ]
    },
    options:{
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:9, boxHeight:9, padding:14, font:{size:11} } }, tooltip:{ backgroundColor:'#1E1745', padding:10 } },
      scales:{ y:{ beginAtZero:true, grid:{ color:'#F1EFF7' }, ticks:{ font:{size:10.5} } }, x:{ grid:{ display:false }, ticks:{ font:{size:10} } } },
      animation:{ duration:900 }
    }
  });

  /* device donut */
  const deviceTotal = report.device.reduce((s,d)=>s+d.value,0);
  document.getElementById('deviceTotal').textContent = deviceTotal;
  const deviceColors = [theme.c1, theme.dark3];
  new Chart(document.getElementById('deviceDonut'), {
    type:'doughnut',
    data:{ labels: report.device.map(d=>d.label), datasets:[{ data: report.device.map(d=>d.value), backgroundColor: deviceColors, borderWidth:0, hoverOffset:6 }] },
    options:{ cutout:'68%', plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#1E1745', padding:10 } }, animation:{ duration:900 } }
  });
  const deviceLegend = document.getElementById('deviceLegend');
  report.device.forEach((d,i)=>{
    const row = document.createElement('div');
    row.className = 'legend-item';
    row.innerHTML = `<span class="sw" style="background:${deviceColors[i]}"></span><span class="lbl">${d.label}</span><span class="val">${d.value}</span>`;
    deviceLegend.appendChild(row);
  });

  /* top countries bar (already sorted ascending->descending; show as-is) */
  new Chart(document.getElementById('countryChart'), {
    type:'bar',
    data:{ labels: report.countries.map(c=>c.label), datasets:[{ data: report.countries.map(c=>c.value), backgroundColor: theme.c1, borderRadius:5, maxBarThickness:16 }] },
    options:{
      indexAxis:'y',
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#1E1745', padding:10 } },
      scales:{ x:{ beginAtZero:true, grid:{ color:'#F1EFF7' }, ticks:{ font:{size:10} } }, y:{ grid:{ display:false }, ticks:{ font:{size:11} } } },
      animation:{ duration:900 }
    }
  });

  /* acquisition donut + descriptive legend */
  const acqTotal = report.acquisition.reduce((s,a)=>s+a.visits,0);
  document.getElementById('acqTotal').textContent = acqTotal;
  const acqColors = [theme.c1, theme.c2, theme.dark3, '#C7CBD6'];
  new Chart(document.getElementById('acqDonut'), {
    type:'doughnut',
    data:{ labels: report.acquisition.map(a=>a.label), datasets:[{ data: report.acquisition.map(a=>a.visits), backgroundColor: acqColors, borderWidth:0, hoverOffset:6 }] },
    options:{ cutout:'62%', plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#1E1745', padding:10, callbacks:{ label: ctx => ` ${ctx.label}: ${ctx.raw} visits` } } }, animation:{ duration:900 } }
  });
  const acqLegend = document.getElementById('acqLegend');
  report.acquisition.forEach((a,i)=>{
    const row = document.createElement('div');
    row.className = 'legend-item stacked';
    row.innerHTML = `
      <div class="row1"><span class="sw" style="background:${acqColors[i]}"></span><span class="lbl" style="font-weight:700;color:var(--dark1);">${a.label}</span><span class="val">${a.pct.toFixed(1)}% · ${a.visits} visits</span></div>
      <div class="desc">${a.desc}</div>`;
    acqLegend.appendChild(row);
  });

  /* full page views chart */
  const sortedPV = [...report.pageViews].sort((a,b)=>a.views-b.views);
  new Chart(document.getElementById('pageViewsChart'), {
    type:'bar',
    data:{ labels: sortedPV.map(p=>p.name), datasets:[{ data: sortedPV.map(p=>p.views), backgroundColor: theme.c1, borderRadius:5, maxBarThickness:14 }] },
    options:{
      indexAxis:'y',
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#1E1745', padding:10 } },
      scales:{ x:{ beginAtZero:true, grid:{ color:'#F1EFF7' }, ticks:{ font:{size:10} } }, y:{ grid:{ display:false }, ticks:{ font:{size:10} } } },
      animation:{ duration:900 }
    }
  });

  /* top landing pages list */
  const topPagesList = document.getElementById('topPagesList');
  topPagesList.innerHTML = report.topPages.map(p=>`
    <div class="legend-item stacked" style="margin-bottom:12px;">
      <div class="row1"><span class="sw" style="background:${theme.c1}"></span><span class="lbl" style="font-weight:700;color:var(--dark1);">${p.name}</span><span class="val">${p.share}%</span></div>
      <div class="desc">${p.sessions} session${p.sessions===1?'':'s'} · left immediately (bounce): ${p.bounce.toFixed(1)}%</div>
    </div>`).join('');

  /* behavior signals bar (full, ordered ascending for readability) */
  const sortedBehavior = [...report.behavior].sort((a,b)=>a.value-b.value);
  new Chart(document.getElementById('behaviorChart'), {
    type:'bar',
    data:{ labels: sortedBehavior.map(b=>b.label), datasets:[{ data: sortedBehavior.map(b=>b.value), backgroundColor: theme.c1, borderRadius:5, maxBarThickness:18 }] },
    options:{
      indexAxis:'y',
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#1E1745', padding:10 } },
      scales:{ x:{ beginAtZero:true, grid:{ color:'#F1EFF7' }, ticks:{ font:{size:10} } }, y:{ grid:{ display:false }, ticks:{ font:{size:11} } } },
      animation:{ duration:900 }
    }
  });

  /* top clicks list, with source pages */
  const clickListCard = document.getElementById('clickListCard');
  clickListCard.innerHTML = report.topClicks.map(c=>`
    <div class="click-list-row">
      <div class="click-list-count">${c.count}</div>
      <div class="click-list-text">
        <div class="t1">${c.label}</div>
        <div class="t2">${c.note}</div>
        ${c.url ? `<div class="t2" style="margin-top:3px;opacity:.8;">🔗 ${c.url}</div>` : ''}
        ${c.pages ? `<div class="t2" style="margin-top:2px;">📄 ${c.pages.join(', ')}</div>` : ''}
      </div>
    </div>`).join('');

  /* video engagement funnel (3 stages) */
  const videoStagesCard = document.getElementById('videoStagesCard');
  if(report.video){
    videoStagesCard.innerHTML = report.video.stages.map(s=>`
      <div class="click-list-row">
        <div class="click-list-count">${s.viewers}</div>
        <div class="click-list-text"><div class="t1">${s.label}</div><div class="t2">${s.note}</div></div>
      </div>`).join('');
  }
}


function render(){
  const ga4 = isGA4();
  if(ga4 && state.view==='summary'){ state.view = items()[0].id; }
  renderOrgSwitcher();
  renderNav();
  if(state.view==='summary'){
    renderSummary();
  } else {
    const item = items().find(c=>c.id===state.view);
    if(item){ ga4 ? renderGA4Report(item) : renderCampaign(item); }
    else { state.view = ga4 ? items()[0].id : 'summary'; render(); return; }
  }
  const noun = ga4 ? 'reports' : 'campaigns';
  document.getElementById('filterNote').textContent = `Showing ${items().filter(inRange).length} of ${items().length} ${noun} · ${fmtDate(state.dateFrom)} – ${fmtDate(state.dateTo)}`;
}

document.getElementById('applyFilter').addEventListener('click', ()=>{
  state.dateFrom = document.getElementById('dateFrom').value || orgBounds().from;
  state.dateTo = document.getElementById('dateTo').value || orgBounds().to;
  render();
});
document.getElementById('resetFilter').addEventListener('click', ()=>{
  const b = orgBounds();
  state.dateFrom = b.from; state.dateTo = b.to;
  document.getElementById('dateFrom').value = state.dateFrom;
  document.getElementById('dateTo').value = state.dateTo;
  render();
});

/* init */
(function init(){
  const b = orgBounds();
  state.dateFrom = b.from; state.dateTo = b.to;
  document.getElementById('dateFrom').value = state.dateFrom;
  document.getElementById('dateTo').value = state.dateTo;
  document.getElementById('orgEyebrow').textContent = ORG_DATA[state.org].label + ' · Campaign Analytics';
  document.getElementById('headerLogo').src = LOGOS[state.org];
  render();
})();
</script>
</body>
</html>
