<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F9F8FC;border:1px solid #E7E5F0;border-radius:10px;margin-bottom:10px;">
    <tr>
        <td width="4" style="background-color:#EF4060;border-radius:10px 0 0 10px;" valign="top">&nbsp;</td>
        <td style="padding:14px 16px;" valign="top">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td valign="middle">
                        <p style="margin:0;font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:13px;color:#2E2260;">
                            {{URL_NAME}}
                        </p>

                        <p style="margin:6px 0 0;font-family:Arial,sans-serif;font-size:10.5px;">
                            <a href="{{URL}}" style="color:#EF4060;text-decoration:none;">
                                🔗 {{URL}}
                            </a>
                        </p>
                    </td>

                    <td width="110" valign="middle" align="right">
                        <table role="presentation" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF;border:1px solid #E7E5F0;border-radius:8px;">
                            <tr>
                                <td style="padding:8px 14px;" align="center">
                                    <p style="margin:0;font-family:Arial,sans-serif;font-size:9.5px;letter-spacing:0.3px;text-transform:uppercase;color:#9CA0B3;">
                                        Total Clicks
                                    </p>
                                    <p style="margin:3px 0 0;font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:18px;color:#EF4060;">
                                        {{TOTAL_CLICKS}}
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
